name: destroy

# Tears down everything in envs/prod (Cloudflare DNS record, EC2 host with its
# Postgres data, SSM parameters, deploy roles, budgets). The state bucket and the destroy role in
# bootstrap/ stay.
# THE DATABASE IS DELETED WITH THE HOST AND THERE ARE NO BACKUPS.
#
# Trigger: push the tag destroy-prod, then approve the run in the "destroy" GitHub Environment.
# To run it again, delete the tag first: git push origin :refs/tags/destroy-prod
on:
  push:
    tags: ["destroy-prod"]

permissions:
  contents: read

concurrency:
  group: terraform-prod
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Required reviewers on this environment are the safety catch against a mistyped tag. It is
    # also the only identity the destroy role trusts (see bootstrap/main.tf).
    environment: destroy
    permissions:
      id-token: write
      contents: read
    env:
      TF_IN_AUTOMATION: "true"
      # These variables have no default but destroy never uses their values.
      TF_VAR_alert_email: destroy@example.com
      TF_VAR_cloudflare_zone_id: unused
      TF_VAR_api_hostname: unused.example.com
      TF_VAR_frontend_origin: https://unused.example.com
      # Deletes the DNS record. Environment secret; a Zone > DNS > Edit token for the API's zone.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: envs/prod
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        working-directory: .
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at a commit that is not on main. Merge it into main first." >&2
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DESTROY_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 7200

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.12.0
          terraform_wrapper: false

      # prevent_destroy is a guard in the code against a plan that deletes or replaces the host
      # (and its database). This throwaway checkout is the one place it must not apply.
      - name: Lift the prevent_destroy guard in this checkout
        working-directory: .
        run: |
          sed -i '/prevent_destroy/d' modules/compute/main.tf
          if grep -rn prevent_destroy modules envs; then
            echo "prevent_destroy is still set" >&2
            exit 1
          fi

      - name: Init
        run: terraform init -input=false

      - name: Show what will be destroyed
        run: terraform plan -destroy -input=false

      # EC2 refuses to terminate a protected instance. Switch it off directly instead of with a
      # targeted apply, which would apply any other pending change to the host unseen. Skipped
      # when the instance is already gone (re-run after a partial destroy).
      - name: Turn off instance termination protection
        run: |
          if terraform state list | grep -qx 'module.compute.aws_instance.api'; then
            aws ec2 modify-instance-attribute --no-disable-api-termination \
              --instance-id "$(terraform output -raw api_instance_id)"
          fi

      - name: Destroy
        run: terraform destroy -auto-approve -input=false

      - name: Confirm the state is empty
        run: |
          remaining=$(terraform state list 2>/dev/null | wc -l)
          echo "Resources left in state: $remaining"
          [ "$remaining" -eq 0 ]
